name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Semantic Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci --omit=optional

      - name: Run tests
        run: npm test

      - name: Check release baseline
        id: release-baseline
        shell: bash
        run: |
          if git tag --list | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No stable vX.Y.Z baseline tag exists; skipping automatic release to avoid an incorrect first version."
          fi

      - name: Release to GitHub
        if: steps.release-baseline.outputs.available == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release